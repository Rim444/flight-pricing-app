<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Решись авиа — вход</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <div class="auth-wrap">
    <div class="box">
      <div class="logos">
        <!-- ЦУ: четырёхлучник-искра (книжка-плюсиком), не куб -->
        <svg width="120" height="48" viewBox="0 0 150 60" xmlns="http://www.w3.org/2000/svg" aria-label="Центральный университет">
          <g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="miter" stroke-linecap="butt">
            <path d="M30 32 L22.5 11.3"/>   <!-- верх-лево: корешок/страница -->
            <path d="M30 32 L9.3 39.5"/>    <!-- низ-лево: вторая страница -->
            <path d="M30 32 L37.5 52.7"/>   <!-- низ-право: замыкающий луч -->
            <path d="M30 32 L54.4 23.2"/>   <!-- право-верх: мыс/стрелка -->
          </g>
          <text x="70" y="44" font-family="Manrope,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">ЦУ</text>
        </svg>
        <div class="sep"></div>
        <!-- Решись авиа: белая "А" на фиолетовом квадрате -->
        <svg width="170" height="48" viewBox="0 0 220 60" xmlns="http://www.w3.org/2000/svg" aria-label="Решись авиа">
          <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8A6BFF"/><stop offset="1" stop-color="#5B3FE0"/></linearGradient></defs>
          <rect x="2" y="6" width="48" height="48" rx="14" fill="url(#rg)"/>
          <text x="26" y="30" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="30" font-weight="800" font-family="Manrope,sans-serif">А</text>
          <text x="62" y="30" font-family="Manrope,sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">РЕШИСЬ</text>
          <text x="62" y="50" font-family="Manrope,sans-serif" font-size="20" font-weight="700" fill="#B9A3FF" letter-spacing="3">АВИА</text>
        </svg>
      </div>
      <h2>Сервис <em>динамических цен</em></h2>
      <p class="sub">Онлайн‑турнир «Решись!» · Центральный университет</p>
      <input id="username" placeholder="Логин (admin)" oninput="checkUserType()">
      <input id="password" type="password" placeholder="Пароль">
      <input id="password-confirm" type="password" placeholder="Подтвердите пароль" class="hidden">
      <button onclick="login()">Войти</button>
      <button id="btn-register" class="sec" onclick="register()">Зарегистрироваться</button>
      <p id="error-msg" class="err"></p>
      <p class="foot">Прогноз спроса: AutoGluon TimeSeries · DirectTabular</p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
