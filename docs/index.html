<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Панель менеджера | Решимся Авиа</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <b>Динамическое ценообразование</b>
    <span id="who"></span>
    <button class="out" onclick="logout()">Выйти</button>
  </header>
  <main>
    <div class="ctrl">
      <select id="route"></select>
      <input id="date" type="date" value="2026-06-12">
      <input id="price" type="number" value="9000" step="100">
      <button onclick="calc()">Рассчитать</button>
    </div>
    <div id="results" class="cards hidden">
      <div><h3>Мест</h3><p id="total-seats">0</p></div>
      <div><h3>Желают купить (медиана)</h3><p id="want-to-buy">0</p></div>
      <div><h3>Реально продано</h3><p id="sold">0</p></div>
      <div><h3>Свободно</h3><p id="remaining">0</p></div>
    </div>
    <div id="chart-container" class="hidden">
      <h3>Распределение спроса при введённой цене</h3>
      <canvas id="distributionChart"></canvas>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
